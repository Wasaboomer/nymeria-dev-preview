name: Publish NYMERIA DEV preview
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Tested DEV source commit SHA (optional for manual fallback)"
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nymeria-dev-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current DEV HEAD
        uses: actions/checkout@v4
        with:
          repository: Wasaboomer/nymeria-preview
          ref: dev/kaelith-modular-character
          persist-credentials: false
          fetch-depth: 1
      - name: Verify SHA, opt-out and successful source tests
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Source DEV HEAD: $actual"
          if [[ -n "$REQUESTED_SHA" && "$actual" != "$REQUESTED_SHA" ]]; then
            echo "::notice::Skipping obsolete deployment request for $REQUESTED_SHA"
            exit 0
          fi
          message="$(git log -1 --format=%B)"
          if [[ "$message" == *'[skip dev deploy]'* ]]; then
            echo "::error::DEV publication explicitly disabled by commit marker"
            exit 1
          fi
          echo "DEV_SOURCE_SHA=$actual" >> "$GITHUB_ENV"
          # The source workflow is still running its dispatch job here.
          # Verify the test JOB succeeded, not the overall workflow conclusion.
          python3 - "$actual" <<'PY'
          import json, os, sys, urllib.request
          sha=sys.argv[1]
          base="https://api.github.com/repos/Wasaboomer/nymeria-preview"
          headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as resp:
                  return json.load(resp)
          runs=get(f"{base}/actions/workflows/nymeria-dev-tests.yml/runs?head_sha={sha}&per_page=30").get("workflow_runs",[])
          ok=False
          for run in runs:
              if run.get("head_sha") != sha: continue
              jobs=get(f"{base}/actions/runs/{run['id']}/jobs?per_page=100").get("jobs",[])
              if any(j.get("name")=="test" and j.get("conclusion")=="success" for j in jobs):
                  ok=True
                  break
          if not ok:
              sys.exit("No successful DEV test job found for this SHA; refusing deploy")
          PY
      - name: Verify game entry
        run: test -f index.html
      - name: Prepare site
        run: |
          touch .nojekyll
          printf 'DEV %s\n' "$DEV_SOURCE_SHA" > dev-preview-version.txt
      - name: Recheck latest DEV SHA before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/Wasaboomer/nymeria-preview.git refs/heads/dev/kaelith-modular-character | cut -f1)"
          test "$latest" = "$DEV_SOURCE_SHA" || { echo "::error::DEV HEAD changed; refusing obsolete deploy"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
